name: CI and GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: flutter pub get

      - name: Install Node dependencies
        run: npm ci

      - name: Validate Playwright PR template
        run: npm run check-pr-playwright-template

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test -r expanded

      - name: Run Playwright smoke gate checks
        env:
          PLAYWRIGHT_SMOKE_RUNS: 3
          PLAYWRIGHT_SMOKE_PASS_PERCENT: 95
          PLAYWRIGHT_SMOKE_GATE_SUMMARY_PATH: ${{ github.workspace }}/test-results/playwright-smoke-gate-summary.json
        run: npm run playwright-smoke-gate-ci

      - name: Upload Playwright smoke gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-gate-summary
          path: test-results/playwright-smoke-gate-summary.json
          if-no-files-found: warn

      - name: Build Flutter web
        run: flutter build web --release --base-href / --no-tree-shake-icons

  deploy-to-github-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test-and-build-web
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Rebuild Flutter web
        run: flutter build web --release --base-href / --no-tree-shake-icons

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: postponed-todos.akra.kr
